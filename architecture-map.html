<style>
:root{--bg:#0F0F0F;--panel:#161616;--panel-2:#1c1c1c;--border:#2a2a2a;--text:#e8e8e8;--muted:#8a8a8a;--client:#4ea1ff;--route:#7bd389;--service:#c792ea;--db:#ffb86b;--external:#ff6b9d;--critical:#ff3860;--accent:#f5b942;--accent-2:#ff7a45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}header{height:116px;border-bottom:1px solid var(--border);padding:15px 18px;background:var(--panel);position:relative;z-index:3}h1{font-size:18px;margin:0 0 6px}header p{color:var(--muted);margin:0 0 12px;font:12px system-ui}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip,button{background:#242424;color:var(--text);border:1px solid #3a3a3a;border-radius:15px;padding:6px 10px;cursor:pointer;font:12px inherit}.chip.active,.chip:hover{border-color:var(--accent);color:var(--accent)}#main{height:calc(100vh - 116px);display:grid;grid-template-columns:minmax(600px,1fr) 350px}#viewport{overflow:hidden;position:relative;background:radial-gradient(circle at 30% 10%,#202020 0,#0f0f0f 45%)}svg{width:100%;height:100%;display:block}.cluster{stroke-width:1;stroke-dasharray:4 5}.cluster-label{fill:#bbb;font-size:15px;font-weight:700}.node rect{fill:#181818;stroke-width:1.4}.node.critical rect{stroke-width:2.4}.node text{pointer-events:none}.label{fill:#eee;font-size:13px;font-weight:bold}.sub{fill:#9b9b9b;font-size:10px}.badge{font-size:10px;font-weight:bold;fill:#111}.edge{fill:none;stroke-width:1.35;opacity:.72}.edge.critical{stroke:var(--critical);stroke-width:2.7}.edge.api{stroke:var(--external)}.edge.db{stroke:var(--db)}.edge.mount{stroke:var(--client)}.edge.normal{stroke:#777}.edge-label{fill:#aaa;font-size:9px}.dim{opacity:.12}.connected{opacity:1}.node{cursor:pointer}.node:hover rect{filter:brightness(1.35)}#controls{position:absolute;left:14px;bottom:14px;display:flex;gap:6px}#sidebar{border-left:1px solid var(--border);background:var(--panel);padding:20px;overflow:auto;font-family:system-ui,sans-serif}#sidebar h2{font-size:17px;margin:0 0 10px}#sidebar h3{font-size:13px;color:var(--accent);margin:20px 0 7px}.muted{color:var(--muted)}code{font:11px ui-monospace,monospace;color:#d7c4e9;word-break:break-word}ul{padding-left:19px;margin:7px 0;line-height:1.45}.finding{border-left:2px solid var(--accent-2);padding-left:10px;margin:11px 0;color:#ccc;font-size:13px;line-height:1.4}.legend{font-size:11px;color:var(--muted);margin-top:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:9px;margin:0 4px 0 9px}.hint{position:absolute;bottom:15px;right:15px;color:#777;font-size:10px;pointer-events:none}
</style></head><body>
<header><h1>Sound It Platform · architecture map</h1><p>React/Vite client → FastAPI API → SQLAlchemy data model · Focus: manual ticket purchase and organizer approval.</p><div class="chips" id="chips"></div><div class="legend"><span class="dot" style="background:var(--critical)"></span>critical spine <span class="dot" style="background:var(--db)"></span>database <span class="dot" style="background:var(--external)"></span>external integration <span class="dot" style="background:var(--client)"></span>mount / client request</div></header>
<div id="main"><div id="viewport"><svg id="map" viewBox="0 0 1830 940" aria-label="Interactive architecture map"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aaa"/></marker></defs><g id="world"></g></svg><div id="controls"><button id="fit">Fit</button><button id="minus">−</button><button id="plus">+</button></div><span class="hint">drag canvas to pan · wheel to zoom · select a node for its connections</span></div><aside id="sidebar"></aside></div>
<script>

];
const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({id,cluster,label,sub,x,y,w,h,color,...opts});
const nodes = [
 N('app','client','App.tsx','route tree + session boot',55,105,205,82,'client',{role:'Bootstraps routing, authentication initialization, maintenance checks, and public/dashboard page trees.',plain:'This is the app’s front door: it decides which screen a visitor sees.',path:'app/src/App.tsx:154',notes:['lines 160-202 initialize auth and poll maintenance status','lines 247-285 define public event and ticket routes','uses React 19 and React Router 7'],tag:['overview','events','auth','critical','all']}),
 N('event-detail','client','EventDetail.tsx','manual ticket form',55,230,205,104,'client',{role:'Displays an event and submits a multipart ticket order with a bearer token and payment proof.',plain:'This is where a customer chooses tickets and sends their payment receipt for review.',path:'app/src/pages/EventDetail.tsx:206',notes:['lines 206-209 disable the local buy UI for closed/past events','lines 225-245 create FormData and POST to /tickets/order','line 256 records a client analytics event'],tag:['overview','events','ticketing','critical','all'],critical:true}),
 N('manage-events','client','ManageEvents.tsx','organizer sales control',55,380,205,92,'client',{role:'Lets an organizer manually close or reopen sales for an event.',plain:'This gives the event owner a one-click switch to stop or restart ticket sales.',path:'app/src/pages/organizer/ManageEvents.tsx:376',notes:['lines 378-381 choose the close/reopen confirmation','lines 385-393 call the sales-toggle endpoint then reload events'],tag:['overview','events','ticketing','all']}),
 N('auth-store','client','authStore.ts','browser auth state',55,520,205,84,'client',{role:'Persists frontend authentication state and wraps network fetch errors.',plain:'It keeps a visitor signed in and explains when the app cannot reach the server.',path:'app/src/store/authStore.ts:32',notes:['lines 32-79 normalise fetch errors','line 85 defines frontend role types','access token is read from local storage by EventDetail'],tag:['overview','auth','ticketing','all']}),
 N('main','entry','main.py','FastAPI app + mounts',335,120,190,106,'route',{role:'Builds the FastAPI application, middleware, static delivery, router mounts, and hourly stale-order worker.',plain:'This starts the server and connects every API area to the website.',path:'main.py:94',notes:['lines 94-120 lifecycle starts the hourly cancellation worker','lines 316-358 mount 43 routers under /api/v1','lines 410-430 fall back to the React single-page app'],tag:['overview','events','ticketing','assistant','critical','all'],critical:true}),

 N('organizer-route','routes','ticketing_organizer.py','legacy approval delegate',605,678,230,84,'route',{role:'Retains the legacy organizer URL but delegates approval to the canonical Tickets API implementation.',plain:'Older links still work, but both routes now follow one approval process.',path:'api/ticketing_organizer.py:229',notes:['delegates directly to api.tickets.approve_ticket_order','no second ticket-generation or notification implementation remains'],tag:['overview','ticketing','all']}),
 N('ticket-service','services','ticketing_service.py','generate tickets + QR',920,110,235,105,'service',{role:'Generates individual QR-coded tickets, updates order/event/tier state, and prevents duplicate generation.',plain:'It turns an approved order into the QR tickets a guest shows at the door.',path:'services/ticketing_service.py:108',notes:['lines 119-122 make a repeated approval idempotent','lines 132-149 create one Ticket per quantity','lines 151-177 mark approval and update sales totals'],tag:['overview','ticketing','critical','all'],critical:true}),

 N('event-table','data','Event + TicketTier','sales rules + inventory',1240,115,230,110,'db',{role:'Stores event timing, capacity, manual sales closure, and ticket-tier inventory/status.',plain:'This is the record that says what the event is and whether tickets are still available.',path:'models.py:1181',notes:['Event.ticket_sales_closed is at line 1214','TicketTier begins at line 1296 and stores price, quantity, sale window','order handler locks Event and TicketTier rows'],tag:['overview','events','ticketing','critical','all'],critical:true}),
 N('order-table','data','TicketOrder','pending manual review',1240,285,230,105,'db',{role:'Stores customer payment proof, order state, quantity, review metadata, and generated-ticket counters.',plain:'This is the organizer’s queue of payment requests waiting for a decision.',path:'models.py:2336',notes:['lines 2344-2352 retain payment-proof metadata','lines 2360-2378 track state, generated count, and reviewer','links to Event, User, TicketTier, and Tickets'],tag:['overview','ticketing','critical','all'],critical:true}),
 N('ticket-table','data','Ticket','QR admission record',1240,450,230,96,'db',{role:'Stores an issued QR ticket and its admission-use audit fields.',plain:'This is the individual pass a guest presents at an event entrance.',path:'models.py:1329',notes:['lines 1340-1342 hold unique ticket and QR tokens','lines 1347-1353 record use and verifier','created by ticketing service after approval'],tag:['overview','ticketing','critical','all'],critical:true}),
 N('postgres','external','PostgreSQL / SQLite','configured SQL backend',1555,130,210,82,'external',{role:'SQLAlchemy connects to SQLite locally or PostgreSQL in production.',plain:'This is the durable database where events, requests, and tickets live.',path:'database.py:9',notes:['lines 9-22 choose engine from DATABASE_URL','lines 25-31 create SessionLocal and Base'],tag:['overview','data','ticketing','all']}),
 N('proof-storage','external','static/uploads','payment proof files',1555,280,210,76,'external',{role:'Holds uploaded payment screenshots under a static URL path.',plain:'This is where a customer’s receipt image is kept for the organizer to inspect.',path:'api/tickets.py:229',notes:['upload directory comes from utils.upload_storage','created under payment_proofs by lines 231-240'],tag:['overview','ticketing','all']}),
 N('notify','external','Email + SMS services','approval notifications',1555,405,210,84,'external',{role:'Delivers organizer-decision messages through email and SMS helper services.',plain:'These services tell the customer when their ticket has been approved or rejected.',path:'api/tickets.py:28',notes:['approval handler calls email and SMS after generation','ticketing service also notifies during stale-order cleanup'],tag:['overview','ticketing','comms','all']}),
 N('openai','external','OpenAI optional LLM','assistant API disabled with UI',1555,555,210,95,'external',{role:'Optional OpenAI client remains configured for future use, while the assistant API is not mounted with its UI route disabled.',plain:'The unfinished assistant is fully off until its user interface is restored.',path:'main.py:20',notes:['assistant is no longer imported or mounted in main.py','App.tsx:284 still keeps the UI route commented out','config retains optional credentials without exposing routes'],tag:['overview','assistant','all']})
];
const edges = [
 {from:'app',to:'event-detail',kind:'normal',label:'route /events/:id',tag:['overview','events','all']},{from:'auth-store',to:'event-detail',kind:'normal',label:'stored bearer token',tag:['overview','auth','ticketing','all']},{from:'event-detail',to:'tickets-route',kind:'critical',label:'POST /api/v1/tickets/order',tag:['overview','ticketing','critical','all']},{from:'main',to:'tickets-route',kind:'mount',label:'router mount',tag:['overview','ticketing','all']},{from:'main',to:'payments-route',kind:'mount',label:'router mount',tag:['overview','payments','all']},{from:'main',to:'organizer-route',kind:'mount',label:'router mount',tag:['overview','ticketing','all']},{from:'main',to:'sales-route',kind:'mount',label:'router mount',tag:['overview','ticketing','all']},{from:'manage-events',to:'sales-route',kind:'api',label:'POST toggle-sales',tag:['overview','ticketing','events','all']},{from:'sales-route',to:'event-table',kind:'db',label:'DB write closed/open',tag:['overview','ticketing','all']},{from:'tickets-route',to:'event-table',kind:'critical',label:'locked event/tier read',tag:['overview','ticketing','critical','all']},{from:'tickets-route',to:'order-table',kind:'critical',label:'DB write PENDING',tag:['overview','ticketing','critical','all']},{from:'tickets-route',to:'proof-storage',kind:'api',label:'payment screenshot',tag:['overview','ticketing','all']},{from:'approve-route',to:'ticket-service',kind:'critical',label:'generate_tickets_from_order',tag:['overview','ticketing','critical','all']},{from:'organizer-route',to:'approve-route',kind:'normal',label:'delegates approval',tag:['overview','ticketing','all']},{from:'ticket-service',to:'order-table',kind:'critical',label:'mark APPROVED',tag:['overview','ticketing','critical','all']},{from:'ticket-service',to:'ticket-table',kind:'critical',label:'DB write QR tickets',tag:['overview','ticketing','critical','all']},{from:'ticket-service',to:'event-table',kind:'critical',label:'increment sales/inventory',tag:['overview','ticketing','critical','all']},{from:'approve-route',to:'notify',kind:'api',label:'email + SMS',tag:['overview','ticketing','comms','all']},{from:'main',to:'stale-job',kind:'normal',label:'hourly worker',tag:['overview','ticketing','all']},{from:'stale-job',to:'order-table',kind:'db',label:'cancel stale',tag:['overview','ticketing','all']},{from:'event-table',to:'postgres',kind:'db',label:'SQLAlchemy table',tag:['overview','data','ticketing','all']},{from:'order-table',to:'postgres',kind:'db',label:'SQLAlchemy table',tag:['overview','data','ticketing','all']},{from:'ticket-table',to:'postgres',kind:'db',label:'SQLAlchemy table',tag:['overview','data','ticketing','all']}
];
const FIXES={};
const KNOWN_BUGS={};
const filters=[['overview','Overview'],['ticketing','Ticketing'],['events','Events'],['auth','Auth'],['payments','Payments'],['assistant','Assistant'],['critical','Critical path'],['all','Show all wires'],['roadmap','Roadmap & bugs']];
const C={client:'var(--client)',route:'var(--route)',service:'var(--service)',db:'var(--db)',external:'var(--external)'};let active='overview',selected=null,hovered=null,tx=0,ty=0,scale=0.82,drag=null;
const world=document.querySelector('#world'),svg=document.querySelector('#map'),sidebar=document.querySelector('#sidebar');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function visible(o){return active==='roadmap'?!!(FIXES[o.id]||KNOWN_BUGS[o.id]):(o.tag||[]).includes(active)}
function render(){world.innerHTML='';const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);world.append(g);clusters.forEach(c=>{const r=document.createElementNS(svg.namespaceURI,'rect');r.setAttribute('class','cluster');r.setAttribute('x',c.x);r.setAttribute('y',c.y);r.setAttribute('width',c.w);r.setAttribute('height',c.h);r.setAttribute('rx',14);r.setAttribute('fill',C[c.id]||'#222');r.setAttribute('fill-opacity','.055');r.setAttribute('stroke',C[c.id]||'#555');g.append(r);const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('class','cluster-label');t.setAttribute('x',c.x+14);t.setAttribute('y',c.y+25);t.textContent=c.label;g.append(t)});edges.forEach((e,i)=>{const a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to),show=visible(e);const p=document.createElementNS(svg.namespaceURI,'path');let x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;if(a.x>b.x){x1=a.x;y1=a.y+a.h/2;x2=b.x+b.w;y2=b.y+b.h/2}const gap=Math.abs(x2-x1),bend=Math.max(35,gap*.48);p.setAttribute('d',`M ${x1} ${y1} C ${x1+(x2>x1?bend:-bend)} ${y1}, ${x2-(x2>x1?bend:-bend)} ${y2}, ${x2} ${y2}`);p.setAttribute('class',`edge ${e.kind} ${show?'':'dim'} ${(selected||hovered)&&!(e.from===(selected||hovered)||e.to===(selected||hovered))?'dim':''}`);p.setAttribute('marker-end','url(#arrow)');g.append(p);if(show){const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('class',`edge-label ${(selected||hovered)&&!(e.from===(selected||hovered)||e.to===(selected||hovered))?'dim':''}`);t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2-5+(i%3)*10);t.textContent=e.label;g.append(t)}});nodes.forEach(n=>{const show=visible(n),focus=selected||hovered,connected=!focus||focus===n.id||edges.some(e=>(e.from===focus&&e.to===n.id)||(e.to===focus&&e.from===n.id));const ng=document.createElementNS(svg.namespaceURI,'g');ng.setAttribute('class',`node ${n.critical?'critical':''} ${show&&connected?'connected':'dim'}`);const r=document.createElementNS(svg.namespaceURI,'rect');r.setAttribute('x',n.x);r.setAttribute('y',n.y);r.setAttribute('width',n.w);r.setAttribute('height',n.h);r.setAttribute('rx',9);r.setAttribute('stroke',n.critical?'var(--critical)':C[n.color]);ng.append(r);[['label',n.label,n.x+11,n.y+23],['sub',n.sub,n.x+11,n.y+42]].forEach(([cl,txt,x,y])=>{const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('class',cl);t.setAttribute('x',x);t.setAttribute('y',y);t.textContent=txt;ng.append(t)});const f=(FIXES[n.id]||[]).length,b=(KNOWN_BUGS[n.id]||[]).length;[[f,'#61d095',n.x+n.w-17],[b,'#ff5d6c',n.x+n.w-38]].forEach(([count,color,x])=>{if(count){const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',x);c.setAttribute('cy',n.y+15);c.setAttribute('r',9);c.setAttribute('fill',color);ng.append(c);const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('class','badge');t.setAttribute('x',x-3);t.setAttribute('y',n.y+19);t.textContent=count;ng.append(t)}});ng.onclick=e=>{e.stopPropagation();selected=n.id;showNode(n)};ng.onmouseenter=()=>{hovered=n.id;render();if(!selected)showNode(n)};ng.onmouseleave=()=>{hovered=null;render();if(!selected)showDefault()};g.append(ng)});}
function showDefault(){sidebar.innerHTML=`<h2>Notable findings from this map</h2><div class="finding"><b>One canonical approval flow.</b> The legacy organizer URL now delegates to <code>api/tickets.py</code>, so ticket generation, notifications, and approval guards live in one place.</div><div class="finding"><b>Unreachable automatic-review code removed.</b> Manual review is now the only implemented purchase policy, matching the pending-order user experience.</div><div class="finding"><b>Assistant is consistently disabled.</b> Its API is no longer mounted while the UI route remains off.</div><div class="finding"><b>Inventory protection is deliberately in the request path.</b> The order endpoint locks event/tier rows before checking capacity and writing a pending order.</div><h3>How to use</h3><p class="muted">Choose a filter, hover for a preview, or click a node to isolate its direct connections. Red is the critical purchase/issuance spine.</p>`}
function showNode(n){const incoming=edges.filter(e=>e.to===n.id),outgoing=edges.filter(e=>e.from===n.id),issues=KNOWN_BUGS[n.id]||[],fixes=FIXES[n.id]||[];sidebar.innerHTML=`<h2>${esc(n.label)}</h2><p class="muted">${esc(n.sub)}</p><h3>Technical role</h3><p>${esc(n.role)}</p><h3>In plain English</h3><p>${esc(n.plain)}</p><h3>Source</h3><code>${esc(n.path)}</code><h3>Notes</h3><ul>${n.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Connections</h3><ul>${incoming.map(e=>`<li>← ${esc(e.label)} from <b>${esc(nodes.find(x=>x.id===e.from).label)}</b></li>`).concat(outgoing.map(e=>`<li>→ ${esc(e.label)} to <b>${esc(nodes.find(x=>x.id===e.to).label)}</b></li>`)).join('')||'<li>None mapped</li>'}</ul>${issues.length?`<h3>Known issues</h3><ul>${issues.map(i=>`<li><b>${i.sev}</b> · ${esc(i.t)}<br><code>${esc(i.ref)}</code></li>`).join('')}</ul>`:''}${fixes.length?`<h3>Fixes</h3><ul>${fixes.map(i=>`<li>${esc(i.t)}</li>`).join('')}</ul>`:''}`;render()}
const chips=document.querySelector('#chips');filters.forEach(([id,label])=>{const b=document.createElement('button');b.className='chip'+(id===active?' active':'');b.textContent=label;b.onclick=()=>{active=id;selected=null;hovered=null;[...chips.children].forEach(x=>x.classList.toggle('active',x===b));showDefault();render()};chips.append(b)});function clamp(){scale=Math.max(.38,Math.min(1.75,scale))}function fit(){scale=.82;tx=0;ty=0;render()}document.querySelector('#fit').onclick=fit;document.querySelector('#plus').onclick=()=>{scale+=.12;clamp();render()};document.querySelector('#minus').onclick=()=>{scale-=.12;clamp();render()};svg.onclick=()=>{selected=null;showDefault();render()};svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);render()}};svg.onpointerup=()=>drag=null;svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect(),pX=(e.clientX-r.left)/r.width*1830,pY=(e.clientY-r.top)/r.height*940,old=scale;scale+=e.deltaY<0?.09:-.09;clamp();tx=pX-(pX-tx)*scale/old;ty=pY-(pY-ty)*scale/old;render()};showDefault();render();
</script></body></html>
