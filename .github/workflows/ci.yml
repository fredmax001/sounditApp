name: CI & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Run NPM Security Audit (Fail on High Severity)
        working-directory: app
        run: npm audit --audit-level=high

      - name: TypeCheck & Build Frontend
        working-directory: app
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Backend Compilation
        run: |
          python3 -m py_compile main.py email_service.py schemas.py security/rate_limiter.py security/security_headers.py security/turnstile.py
